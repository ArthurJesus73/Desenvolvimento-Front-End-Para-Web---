<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tradicional e arrow function</title>
</head>
<body>
    <script>
        console.log("Adição", x+10);
        console.log("subtração", x-10);
        console.log("Multiplicação", x*10);
        console.log("Divisão", x/10);
        console.log("Expoente", x**10);
        console.log("Resto", x%10);

        let z;
        x = 10, z=++x;
        console.log("++x: z=", z , "x= ",x);
        x = 10, z= x++;
        console.log("x++: z=",z , "x =",x);
        x = 10,z=--x;
        console.log("--x: ",z , "x = ", x);
        x = 10, z=x--;
        console.log("x--: z=", z , "x=",x);
    </script>
    
</body>
</html>
