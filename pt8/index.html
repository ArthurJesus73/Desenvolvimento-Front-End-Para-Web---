<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserindo um grid na página</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Testando um grid</h1>
    <hr>
     <h2>1. Grid responsive(.grid-principal)</h2>
     <div class="grid-principal">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>
        <div>Card 4</div>

     </div>
     <hr>
     <h2>2. Layout da pagina com Areas</h2>
     <div class="layout-pagina">
        <header class="header">header</header>
        <aside class="sidebar">Sidebar - Menu</aside>
        <main class="main">Main - Conteudo principal aqui</main>
        <footer class="footer">Footer</footer>
     </div>
    
    
</body>
</html>
